<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Showtime Finder — Saved List</title>
<link rel="stylesheet" href="list.css" />
</head>
<body>
<header>
  <h1>Saved Titles</h1>
  <div class="header-controls">
    <label>
      Sort by
      <select id="sort-select">
        <option value="savedAt">Date saved (newest)</option>
        <option value="title">Title</option>
        <option value="available">Availability</option>
      </select>
    </label>
    <button type="button" id="export-btn">Export backup</button>
    <button type="button" id="export-html-btn">Export HTML</button>
    <button type="button" id="import-btn">Import backup</button>
    <input type="file" id="import-file" accept="application/json" hidden />
  </div>
</header>

<div id="list-message" class="list-message" hidden></div>

<p id="empty-state" hidden>
  Nothing saved yet. Save titles from the popup while reading a Variety review, or after a manual search.
</p>

<table>
  <thead>
    <tr>
      <th></th>
      <th>Title</th>
      <th>Streaming</th>
      <th>Theatrical</th>
      <th>Saved</th>
      <th>Last checked</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="list-body"></tbody>
</table>

<script type="module" src="list.js"></script>
</body>
</html>
