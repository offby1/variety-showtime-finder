<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Showtime Finder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Showtime Finder</h1>
  </header>

  <section id="review-banner" hidden>
    <p>Detected on this page: <strong id="review-title"></strong></p>
  </section>

  <section id="search-section">
    <form id="search-form">
      <input id="search-input" type="text" placeholder="Search title..." autocomplete="off" />
      <button type="submit">Search</button>
    </form>
    <div id="search-status"></div>
    <ul id="search-results"></ul>
  </section>

  <section id="detail-section" hidden>
    <button id="back-button" type="button">&larr; Back to results</button>
    <div id="detail-content"></div>
  </section>

  <section id="saved-section">
    <h2>Saved <a id="open-list" href="list.html" target="_blank">(view all)</a></h2>
    <div id="saved-message" class="saved-message" hidden></div>
    <ul id="saved-list"></ul>
  </section>

  <footer>
    <a id="open-options" href="options.html" target="_blank">Settings</a>
    <span id="version-stamp" class="version-stamp"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
